<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과음 후보 비교</title>
<style>
  /* 임시 시험 페이지 (2026-11-21, 통과·실패·완료 소리 후보 고르기). 고른 뒤 지운다 */
  :root {
    --bg: #f2f2f3; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --accent: #1f4fd8; --accent-text: #ffffff; --line: #dcdce0;
    --gap: 12px; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1d1d20; --text: #f2f2f3; --muted: #a0a0a8; --line: #2e2e33; --accent: #5b82ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: var(--gap); }
  .card h2 { font-size: 17px; margin: 0 0 2px; }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button { font: inherit; font-size: 15px; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button.all { grid-column: 1 / -1; background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:active { opacity: 0.6; }
</style>
</head>
<body>
<main>
  <h1>효과음 후보 비교</h1>
  <p class="lead">아이폰 무음 스위치를 끄고, 각 후보의 통과·실패·완료를 들어보세요. 마음에 드는 번호를 알려주시면 앱에 넣습니다.</p>
  <div id="list"></div>
</main>
<script>
// 앱(src/speech/feedbackSound.ts)과 같은 방식: 음을 코드로 만들어 WAV로 바꾼 뒤 <audio>로 튼다
const PEAK = 0.5;

// 새 후보의 박자. 통과는 0.6초, 완료는 약 1.2초, 실패는 0.5초 (사용자 결정 2026-11-21)
const NEW_NOTES = {
  pass: [{ f: 784, at: 0, len: 0.45 }, { f: 1047, at: 0.1, len: 0.5 }],
  fail: [{ f: 659, at: 0, len: 0.3 }, { f: 523, at: 0.15, len: 0.35 }],
  complete: [
    { f: 523, at: 0, len: 0.3 }, { f: 659, at: 0.12, len: 0.3 },
    { f: 784, at: 0.24, len: 0.3 }, { f: 1047, at: 0.36, len: 0.8 }
  ]
};

// 지금 앱에 들어 있는 소리 (비교 기준)
const OLD_NOTES = {
  pass: [{ f: 784, at: 0, len: 0.3 }, { f: 1047, at: 0.1, len: 0.35 }],
  fail: [{ f: 659, at: 0, len: 0.25 }, { f: 523, at: 0.15, len: 0.3 }],
  complete: [
    { f: 523, at: 0, len: 0.3 }, { f: 659, at: 0.12, len: 0.3 },
    { f: 784, at: 0.24, len: 0.3 }, { f: 1047, at: 0.36, len: 0.7 }
  ]
};

// 배음 목록: r = 기본음의 몇 배 높이, a = 크기, d = 기본음보다 몇 배 빨리 사라지는지.
// 맑은 악기(유리잔·실로폰·종)는 정수배가 아닌 높은 배음이 잠깐 반짝이고 먼저 사라진다
const CANDIDATES = [
  {
    name: '0. 지금 소리', desc: '비교용. 2배·3배 배음이라 전자음 느낌, 짧게 끊김',
    rate: 22050, notes: OLD_NOTES, oct: { pass: 1, fail: 1, complete: 1 }, old: true
  },
  {
    name: '1. 유리잔 "띵"', desc: '한 옥타브 높게. 거의 순수한 음 두 개를 아주 살짝 어긋나게 겹쳐 은은하게 떨림',
    rate: 44100, notes: NEW_NOTES, oct: { pass: 2, fail: 1.5, complete: 2 },
    partials: [{ r: 1, a: 1, d: 1 }, { r: 1.004, a: 0.6, d: 1 }, { r: 2.756, a: 0.06, d: 3 }]
  },
  {
    name: '2. 글로켄슈필 "칭"', desc: '한 옥타브 높게. 쇠막대 실로폰. 높은 반짝임이 먼저 사라지고 맑은 음만 남음',
    rate: 44100, notes: NEW_NOTES, oct: { pass: 2, fail: 1.5, complete: 2 },
    partials: [{ r: 1, a: 1, d: 1 }, { r: 2.756, a: 0.3, d: 2.5 }, { r: 5.404, a: 0.12, d: 4 }]
  },
  {
    name: '3. 마림바 "통"', desc: '지금과 같은 높이. 나무 실로폰처럼 둥글고 따뜻함',
    rate: 44100, notes: NEW_NOTES, oct: { pass: 1, fail: 1, complete: 1 },
    partials: [{ r: 1, a: 1, d: 1 }, { r: 3.932, a: 0.35, d: 3 }, { r: 9.538, a: 0.08, d: 6 }]
  },
  {
    name: '4. 차임벨 "딩~"', desc: '지금과 같은 높이. 처음엔 반짝, 뒤로 갈수록 맑은 종소리로 바뀜',
    rate: 44100, notes: NEW_NOTES, oct: { pass: 1, fail: 1, complete: 1 }, fm: { ratio: 3.5, index: 1.6 }
  }
];

// 끝을 0으로 부드럽게 닫는 길이. 갑자기 끊기면 '틱' 소리가 난다
const TAIL = 0.02;

function noteSample(c, n, t) {
  const w = 2 * Math.PI * n.f * t;
  const base = 4.6 / n.len; // 음 길이 끝에서 기본음이 약 1%(−40dB)까지 줄어드는 빠르기
  if (c.old) {
    const env = Math.exp(-5 * t / n.len);
    return env * (Math.sin(w) + 0.25 * Math.sin(2 * w) + 0.1 * Math.sin(3 * w));
  }
  if (c.fm) {
    // FM: 높은 음으로 기본음을 흔들어 종소리의 금속성을 만들고, 흔드는 세기를 빨리 줄여 맑은 음만 남긴다
    const index = c.fm.index * Math.exp(-t * base * 2.5);
    return Math.exp(-t * base) * Math.sin(w + index * Math.sin(c.fm.ratio * w));
  }
  let s = 0;
  for (const p of c.partials) s += p.a * Math.exp(-t * base * p.d) * Math.sin(w * p.r);
  return s;
}

function render(c, kind) {
  const RATE = c.rate;
  const oct = c.oct[kind];
  const notes = c.notes[kind].map((n) => ({ ...n, f: n.f * oct }));
  const end = Math.max(...notes.map((n) => n.at + n.len));
  const out = new Float32Array(Math.ceil(end * RATE));
  const attack = Math.round((c.old ? 0.005 : 0.003) * RATE);
  for (const n of notes) {
    const start = Math.round(n.at * RATE);
    const count = Math.round(n.len * RATE);
    const tail = Math.round(TAIL * RATE);
    for (let i = 0; i < count && start + i < out.length; i++) {
      const fadeIn = Math.min(1, i / attack);
      const fadeOut = c.old ? 1 : Math.min(1, (count - i) / tail);
      out[start + i] += fadeIn * fadeOut * noteSample(c, n, i / RATE);
    }
  }
  const max = out.reduce((m, v) => Math.max(m, Math.abs(v)), 0) || 1;
  for (let i = 0; i < out.length; i++) out[i] = (out[i] / max) * PEAK;
  return { samples: out, rate: RATE };
}

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s * 0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

const urls = new Map();
function urlFor(ci, kind) {
  const key = ci + kind;
  if (!urls.has(key)) {
    const { samples, rate } = render(CANDIDATES[ci], kind);
    urls.set(key, URL.createObjectURL(encodeWav(samples, rate)));
  }
  return urls.get(key);
}

// iOS는 <audio> 하나를 탭으로 깨워 두면 이어서 코드로 다시 틀 수 있어서, 하나를 돌려 쓴다
const player = new Audio();
function play(ci, kind) {
  return new Promise((resolve) => {
    player.onended = () => resolve();
    player.onerror = () => resolve();
    player.src = urlFor(ci, kind);
    player.play().catch(() => resolve());
  });
}

async function playAll(ci) {
  for (const kind of ['pass', 'fail', 'complete']) {
    await play(ci, kind);
    await new Promise((r) => setTimeout(r, 500));
  }
}

const LABELS = { pass: '통과', fail: '실패', complete: '완료' };
const list = document.getElementById('list');
CANDIDATES.forEach((c, ci) => {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<h2>${c.name}</h2><p>${c.desc}</p><div class="row"></div>`;
  const row = card.querySelector('.row');
  for (const kind of ['pass', 'fail', 'complete']) {
    const b = document.createElement('button');
    b.textContent = LABELS[kind];
    b.onclick = () => play(ci, kind);
    row.appendChild(b);
  }
  const all = document.createElement('button');
  all.className = 'all';
  all.textContent = '세 개 이어 듣기';
  all.onclick = () => playAll(ci);
  row.appendChild(all);
  list.appendChild(card);
});
</script>
</body>
</html>
