<!doctype html>
<html lang="ko" class="splashing">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치·홈 막대 자리를 env(safe-area-inset-*)로 직접 비우기 위해 필요 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- iOS 홈화면 앱 모드(주소창 없는 전체화면)로 열리게 하는 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Natter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <!-- ?v=2: 아이콘 색을 바꿨을 때 아이폰이 예전 아이콘을 기억해 두었다가 다시 쓰지 않게 주소를 바꾼다 -->
    <link rel="apple-touch-icon" href="/tutor/icons/apple-touch-icon.png?v=2" />
    <!-- 로딩화면 글자가 기본 글꼴로 먼저 그려졌다가 바뀌지 않게 Barlow를 미리 받는다 -->
    <link rel="preload" href="/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 로딩화면(4A 시안) 스타일. 앱 CSS(tokens.css)가 읽히기 전에 그려져야 해서 토큰 변수를 못 쓰고 색을 직접 적는다.
         #1a3fbf = 라이트 테마 --accent -->
    <script>
      // 새 버전을 받으면 앱이 화면을 스스로 한 번 새로 고친다(main.tsx registerSW 자동 업데이트).
      // 그때 로딩화면이 또 나오면 "로딩 → 본 화면 → 로딩"처럼 두 번 보이므로, 이번에 켠 동안 이미 보여 줬으면 건너뛴다.
      // sessionStorage는 새로 고쳐도 남고 앱을 완전히 닫으면 지워진다 — 다시 켜면 로딩화면이 정상으로 나온다.
      (function () {
        try {
          if (sessionStorage.getItem('natter-splash-shown')) {
            document.documentElement.className = 'skip-splash';
          } else {
            sessionStorage.setItem('natter-splash-shown', '1');
          }
        } catch (e) { /* 저장이 막힌 환경이면 그냥 매번 보여 준다 */ }
      })();
    </script>
    <style>
      html.skip-splash #splash { display: none; }
      html.splashing, html.splashing body { background: #1a3fbf; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #1a3fbf; color: #fff;
        transition: opacity .4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      /* 글꼴이 준비되기 전에는 글자를 숨겨 기본 글꼴 → Barlow로 바뀌는 깜빡임을 막는다 */
      #splash .words { display: flex; flex-direction: column; align-items: center; gap: 12px; visibility: hidden; }
      #splash.fonts-ready .words { visibility: visible; }
      #splash .name { font: 600 40px/1 'Barlow Condensed', sans-serif; letter-spacing: .04em; }
      /* Barlow 이탤릭 글꼴 파일은 없어서 브라우저가 기울여 그린다 — 시안도 같은 방식 */
      #splash .tagline { font: italic 400 16px/1 'Barlow', sans-serif; letter-spacing: .03em; }
      #splash .bars { height: 96px; display: flex; align-items: center; gap: 10px; }
      #splash .bars span {
        display: block; width: 13px; border-radius: 13px; background: #fff;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      #splash .bars span:nth-child(1) { height: 30px; animation-delay: 0s; }
      #splash .bars span:nth-child(2) { height: 62px; animation-delay: .12s; }
      #splash .bars span:nth-child(3) { height: 96px; animation-delay: .24s; }
      #splash .bars span:nth-child(4) { height: 62px; animation-delay: .36s; }
      #splash .bars span:nth-child(5) { height: 30px; animation-delay: .48s; }
      @keyframes splash-bar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .bars span { animation: none; }
      }
    </style>
    <title>Natter</title>
  </head>
  <body>
    <!-- 로딩화면은 #root 밖에 둔다. 안에 두면 React가 첫 화면을 그리며 바로 지워 버려 서서히 사라지게 할 수 없다 -->
    <div id="splash" aria-label="Natter 불러오는 중" role="status">
      <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="words">
        <span class="name">Natter</span>
        <span class="tagline">Talk more. Worry less.</span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // 앱 화면이 #root에 처음 그려지면 로딩화면을 서서히 지운다.
      // 최소 1.3초는 보여 준다 — 저장된 앱이 너무 빨리 뜨면 파란 화면이 번쩍 지나가 보기 불편하다.
      (function () {
        var MIN_SHOW_MS = 1300;
        var FADE_MS = 400;
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');
        var started = Date.now();
        var done = false;
        if (document.documentElement.classList.contains('skip-splash')) { splash.remove(); return; }

        var showWords = function () { splash.classList.add('fonts-ready'); };
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(showWords);
          // 글꼴이 늦게 오더라도 글자가 영영 안 보이는 일은 없게
          setTimeout(showWords, 600);
        } else {
          showWords();
        }

        function hide() {
          if (done) return;
          done = true;
          var wait = Math.max(0, MIN_SHOW_MS - (Date.now() - started));
          setTimeout(function () {
            splash.classList.add('hide');
            // 파란 바탕을 남겨 두면 화면을 끝까지 당겼을 때 위아래로 파란 테두리가 비친다
            document.documentElement.classList.remove('splashing');
            setTimeout(function () { splash.remove(); }, FADE_MS);
          }, wait);
        }

        if (root.firstChild) { hide(); return; }
        var observer = new MutationObserver(function () {
          if (root.firstChild) { observer.disconnect(); hide(); }
        });
        observer.observe(root, { childList: true });
        // 앱 코드가 실패해도 로딩화면이 오류를 영영 가리지 않게
        setTimeout(function () { observer.disconnect(); hide(); }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
